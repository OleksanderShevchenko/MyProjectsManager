<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Timesheet</title>
</head>
<body>
    <h1>Welcome, {{ request.user.username }}!</h1>

    <h2>Your Assigned Tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>
                <strong>{{ task.project.name }}</strong> - {{ task.title }}
                (Budget: {{ task.budget_hours }}h, Deadline: {{ task.deadline }})
            </li>
        {% empty %}
            <li>You have no tasks assigned yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
