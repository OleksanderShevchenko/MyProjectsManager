<button
    id="day-cell-{{ day.date|date:'Y-m-d' }}"
    {% if is_admin %}
    hx-post="{% url 'work_time_reporter:calendar_settings_year' year=year %}"
    hx-vals='{"date": "{{ day.date|date:"Y-m-d" }}", "type": "{{ day.next_type }}"}'
    hx-target="this"
    hx-swap="outerHTML"
    {% else %}
    disabled
    {% endif %}
    class="day-btn text-xs font-semibold py-1 rounded transition-all text-center {% if day.day_type == 'HOLIDAY' %}bg-red-500 text-white shadow-sm{% elif day.day_type == 'SHORT_DAY' %}bg-amber-400 text-gray-900 shadow-sm{% elif day.day_type == 'FREE_MONDAY' %}bg-emerald-500 text-white shadow-sm{% elif day.is_weekend %}text-red-400 bg-red-50/50 hover:bg-red-100{% else %}text-gray-700 hover:bg-indigo-50{% endif %}"
    title="{{ day.date|date:'Y-m-d' }}{% if day.day_type %}: {{ day.day_type }}{% endif %}">
    {{ day.day_num }}
</button>
