name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'epic/**'
      - 'phase-*/**'
  pull_request:
    branches:
      - main
      - 'epic/**'

jobs:
  test:
    name: Run Pytest Suite with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Django System Check
        env:
          SECRET_KEY: ci-temporary-secret-key-for-testing-only
          DEBUG: "True"
          DB_SOURCE: "local"
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: uv run python manage.py check

      - name: Run Pytest with Coverage
        env:
          SECRET_KEY: ci-temporary-secret-key-for-testing-only
          DEBUG: "True"
          DB_SOURCE: "local"
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: uv run pytest --cov=work_time_reporter -v

  lint:
    name: Code Linting Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check .
