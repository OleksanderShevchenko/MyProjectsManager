[project]
name = "myprojectsmanager"
version = "0.1.0"
description = "Web tool for weekly working-hours reporting"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0",
    "office365-rest-python-client>=2.6.2",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "**/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
